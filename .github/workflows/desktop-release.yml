name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Check tag and native architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          node -e 'if (process.arch !== process.env.EXPECTED_ARCH) process.exit(1)'
          python scripts/release.py check
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            python scripts/release.py check --tag "$GITHUB_REF_NAME"
          fi
      - name: Install build dependencies
        run: |
          python -m pip install '.[dev]' 'pyinstaller==6.22.3'
          npm ci --prefix desktop
      - name: Test
        run: |
          python -m pytest -q
          npm test --prefix desktop
      - name: Build backend
        run: python desktop/scripts/build-backend.py
      - name: Prepare self-signing identity
        env:
          ROOSTA_SIGNING_P12: ${{ secrets.ROOSTA_SIGNING_P12 }}
          ROOSTA_SIGNING_PASSWORD: ${{ secrets.ROOSTA_SIGNING_PASSWORD }}
        run: bash desktop/scripts/ci-signing.sh
      - name: Build DMG
        run: npm run dmg --prefix desktop
      - name: Smoke-test packaged backend
        env:
          ROOSTA_BUILD_ARCH: ${{ matrix.arch }}
        run: python desktop/scripts/smoke-backend.py "desktop/dist/Roosta-darwin-$ROOSTA_BUILD_ARCH/Roosta.app/Contents/Resources/roosta-backend/roosta-backend"
      - uses: actions/upload-artifact@v6
        with:
          name: Roosta-${{ matrix.arch }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.sha256
          if-no-files-found: error
      - name: Remove temporary signing keychain
        if: always()
        run: |
          if [ -n "${ASSISTANT_CODESIGN_KEYCHAIN:-}" ]; then
            security delete-keychain "$ASSISTANT_CODESIGN_KEYCHAIN"
          fi
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Build and test Python distributions
        run: |
          python -m pip install '.[dev]' build twine
          python scripts/release.py check
          python -m pytest -q
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          python -m build
          python -m twine check dist/*
          python -m venv /tmp/roosta-wheel
          /tmp/roosta-wheel/bin/pip install dist/*.whl
          cd /tmp
          /tmp/roosta-wheel/bin/roosta --version
          /tmp/roosta-wheel/bin/roosta init --skip-checks --no-git /tmp/roosta-wheel-workspace
      - uses: actions/upload-artifact@v6
        with:
          name: Python
          path: dist/*
          if-no-files-found: error
  pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, python]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/roosta
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: Python
          path: dist
      - name: Publish to PyPI using trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
      - name: Verify published package hashes
        run: python scripts/release.py verify-pypi dist
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, python, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          merge-multiple: true
          path: release-assets
      - name: Verify assets and publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release.py publish release-assets
