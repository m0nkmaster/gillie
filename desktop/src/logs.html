<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Roosta Skill Logs</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: #0f1117;
      color: #e1e4e8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: .8rem 1rem;
      border-bottom: 1px solid #2d333b;
    }
    h1 { margin: 0; font-size: 1rem; }
    .actions { display: flex; gap: .5rem; }
    button {
      border: 1px solid #555c66;
      border-radius: 0;
      padding: .35rem .65rem;
      background: #21262d;
      color: #e1e4e8;
      font: inherit;
      cursor: pointer;
      box-shadow: 0 2px 0 #050608;
    }
    button:hover { background: #2b2f36; border-color: #727a86; }
    button:active {
      background: #191c21;
      transform: translateY(1px);
      box-shadow: inset 0 2px 0 #00000059;
    }
    main {
      flex: 1;
      padding: 1rem;
      overflow: auto;
    }
    .error { color: #f85149; margin-bottom: 1rem; }
    h2 {
      margin: 0 0 .65rem;
      color: #8b949e;
      font-size: .72rem;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .skills { display: grid; gap: .75rem; margin-bottom: 1.5rem; }
    .skill {
      padding: .85rem 1rem;
      border: 1px solid #2d333b;
      border-radius: 8px;
      background: #161b22;
    }
    .skill-head { display: flex; justify-content: space-between; gap: 1rem; }
    .skill-name { font-weight: 650; }
    .skill-sub, .meta { color: #8b949e; font-size: .75rem; margin-top: .15rem; }
    .status { font-size: .7rem; font-weight: 700; text-transform: uppercase; }
    .status-success { color: #3fb950; }
    .status-running { color: #58a6ff; }
    .status-queued { color: #bc8cff; }
    .status-blocked { color: #d6b45f; }
    .status-interrupted { color: #8b949e; }
    .status-error, .status-auth-failed { color: #f85149; }
    .output { margin-top: .65rem; color: #c9d1d9; line-height: 1.45; }
    pre {
      margin: .45rem 0 0;
      padding: .6rem;
      border: 1px solid #21262d;
      border-radius: 5px;
      background: #0d1117;
      color: #b8c1cc;
      font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .run { display: grid; grid-template-columns: 1fr auto; gap: .75rem;
      padding: .45rem 0; border-bottom: 1px solid #1c2128; font-size: .78rem; }
    .run-meta { color: #8b949e; font-size: .7rem; margin-top: .1rem; }
    details { margin-top: 1.5rem; color: #8b949e; }
    summary { cursor: pointer; font-size: .8rem; }
  </style>
</head>
<body>
  <header>
    <h1>Skill logs</h1>
    <div class="actions">
      <button id="refresh">Refresh</button>
      <button id="copy">Copy</button>
      <button id="runner">Open Skill Runner</button>
    </div>
  </header>
  <main id="output">Loading...</main>
  <script src="logs.js"></script>
</body>
</html>
