<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Roosta is starting</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
      background: radial-gradient(60% 55% at 50% 38%, #3a1a0c 0%, #160c08 55%, #0b0806 100%);
      color: #f3e9e1;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
      overflow: hidden;
    }
    main { width: min(520px, 100%); display: grid; justify-items: center; }
    .hero { position: relative; width: 220px; height: 220px; margin-bottom: 1.2rem; }
    .hero::before {
      content: "";
      position: absolute;
      inset: 12%;
      border-radius: 50%;
      background: #ff8a2a;
      filter: blur(48px);
      opacity: .35;
      animation: glow 3.2s ease-in-out infinite;
    }
    .hero img {
      position: relative;
      width: 100%;
      height: 100%;
      animation: float 3.2s ease-in-out infinite;
    }
    @keyframes float { 50% { transform: translateY(-8px); } }
    @keyframes glow { 50% { opacity: .55; } }
    .brand {
      margin: 0 0 .35rem;
      font-size: .78rem;
      font-weight: 700;
      letter-spacing: .32em;
      text-transform: uppercase;
      color: #ff9a3d;
    }
    #greeting {
      margin: 0 0 .4rem;
      font-size: 1.75rem;
      font-weight: 650;
      letter-spacing: -.01em;
      line-height: 1.15;
    }
    #flavour { margin: 0 0 1.1rem; font-size: .95rem; color: #c9b6a8; line-height: 1.5; min-height: 1.4em; }
    .statusline {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .6rem;
      font-size: .82rem;
      color: #a8968a;
      line-height: 1.5;
    }
    .statusline .dot {
      flex: none;
      width: 8px; height: 8px; border-radius: 50%;
      background: #ff9a3d;
      animation: ping 1.8s ease-out infinite;
    }
    @keyframes ping {
      0% { box-shadow: 0 0 0 0 #ff9a3d88; }
      70%, 100% { box-shadow: 0 0 0 9px #ff9a3d00; }
    }
    #status { margin: 0; white-space: pre-wrap; }
    .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: .65rem; margin-top: 1.7rem; }
    button {
      border: 1px solid #ffffff26;
      border-radius: 10px;
      padding: .6rem 1rem;
      background: #ffffff10;
      color: #f3e9e1;
      cursor: pointer;
      font: inherit;
      transition: background .15s ease, border-color .15s ease, transform .05s ease;
    }
    button:hover { background: #ffffff1c; border-color: #ffffff4a; }
    button:active { transform: translateY(1px); }
    button.primary { background: #ff8a2a; border-color: transparent; color: #1a0b03; font-weight: 600; }
    button.primary:hover { filter: brightness(1.08); }
    button:disabled { opacity: .5; cursor: wait; }
    #repair[hidden] { display: none; }
    @media (prefers-reduced-motion: reduce) {
      .hero::before, .hero img, .statusline .dot { animation: none; }
    }
  </style>
</head>
<body>
  <main>
    <div class="hero"><img src="roosta.png" alt=""></div>
    <p class="brand">Roosta</p>
    <h1 id="greeting">Waking Roosta</h1>
    <p id="flavour"></p>
    <div class="statusline">
      <span class="dot" aria-hidden="true"></span>
      <p id="status">Starting the dashboard runner...</p>
    </div>
    <div class="actions">
      <button class="primary" id="retry">Retry</button>
      <button id="repair" hidden>Set up or repair dashboard</button>
      <button id="logs">View logs</button>
    </div>
  </main>
  <script src="recovery.js"></script>
</body>
</html>
